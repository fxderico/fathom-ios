name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: Fathom
  BUNDLE_ID: art.luxarcanum.fathom
  RELEASE_BASE: https://github.com/fxderico/fathom-ios/releases/latest/download

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build (unsigned archive)
        run: |
          set -o pipefail
          xcodebuild \
            -project "$APP_NAME.xcodeproj" \
            -scheme "$APP_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "build/$APP_NAME.xcarchive" \
            archive \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO CODE_SIGN_ENTITLEMENTS=""

      - name: Package IPA
        id: pkg
        run: |
          APP_PATH="build/$APP_NAME.xcarchive/Products/Applications/$APP_NAME.app"
          test -d "$APP_PATH"
          rm -rf Payload && mkdir Payload
          cp -r "$APP_PATH" Payload/
          VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_PATH/Info.plist")
          zip -qr "$APP_NAME.ipa" Payload            # stable name -> /releases/latest/download/Fathom.ipa
          SIZE=$(stat -f%z "$APP_NAME.ipa")
          echo "ver=$VER"     >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE"   >> "$GITHUB_OUTPUT"
          ls -la "$APP_NAME.ipa"

      - name: Write SideStore source (repo.json)
        run: |
          DATE=$(date -u +%Y-%m-%d)
          cat > repo.json <<JSON
          {
            "name": "Fathom",
            "identifier": "art.luxarcanum.source",
            "subtitle": "Proxy browser",
            "description": "A browser with the Fathom proxy built in.",
            "iconURL": "https://luxarcanum.art/favicon.ico",
            "website": "https://luxarcanum.art",
            "sourceURL": "https://luxarcanum.art/repo.json",
            "tintColor": "#3b82f6",
            "apps": [
              {
                "name": "Fathom",
                "bundleIdentifier": "${BUNDLE_ID}",
                "developerName": "fede",
                "subtitle": "Proxy browser",
                "localizedDescription": "Native iOS browser with the Fathom proxy built in. Failover proxy origins, native ad blocking, tabs.",
                "iconURL": "https://luxarcanum.art/favicon.ico",
                "tintColor": "#3b82f6",
                "category": "utilities",
                "version": "${{ steps.pkg.outputs.ver }}",
                "versionDate": "${DATE}",
                "versionDescription": "Automated build ${{ github.sha }}",
                "downloadURL": "${RELEASE_BASE}/Fathom.ipa",
                "size": ${{ steps.pkg.outputs.size }},
                "minOSVersion": "16.0",
                "screenshotURLs": []
              }
            ],
            "news": []
          }
          JSON
          cat repo.json

      - name: Publish release (IPA + repo.json, public)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.ver }}-${{ github.run_number }}
          name: Fathom ${{ steps.pkg.outputs.ver }} (build ${{ github.run_number }})
          make_latest: true
          files: |
            Fathom.ipa
            repo.json
